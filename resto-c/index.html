<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>動詞学習ゲーム</title>
<link rel="stylesheet" href="game.css">
<script>
  document.addEventListener('contextmenu', e => e.preventDefault());
</script>


<style id="audio-preparation-style">
  #audio-start-gate {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.82);
  }
  #audio-start-gate-inner {
    text-align: center;
    color: #fff;
    padding: 24px;
  }
  #audio-start-gate p {
    margin: 0 0 16px;
    font-size: 1.1rem;
  }
  #audio-start-gate button {
    min-width: 150px;
    min-height: 48px;
    font-size: 1.1rem;
    cursor: pointer;
  }

  #start-section {
    flex-wrap: wrap;
  }
  .audio-start-row {
    width: 100%;
    flex: 0 0 100%;
    margin-top: 10px;
    text-align: center;
  }
  #audio-load-status {
    display: none;
    margin-top: 8px;
    font-size: 0.95em;
  }
  #audio-progress-wrap {
    display: none;
    width: min(320px, 82vw);
    height: 10px;
    margin: 8px auto 0;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.12);
  }
  #audio-progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: currentColor;
    transition: width 80ms linear;
  }
</style>

</head>
<body>

<div id="audio-start-gate" role="dialog" aria-modal="true" aria-labelledby="audio-start-gate-text">
  <div id="audio-start-gate-inner">
    <p id="audio-start-gate-text">Appuyer sur commencer</p>
    <button id="audio-start-gate-button" type="button"
      onclick="if(window.segmentAudio && window.segmentAudio.prepare){window.segmentAudio.prepare();}else{alert('音声処理を読み込めません。ページを再読み込みしてください。');}">
      Commencer
    </button>
  </div>
</div>

<h1>動詞学習ゲーム</h1>
<div id="intro-image" style="margin-top: 20px;">
  <img src="image/image-00.png" alt="例示画像" style="width:60%; max-width:300px;">
  <p style="font-size: 1.2em; margin-top: 10px;">学籍番号の下4桁を入力してください</p>
</div>
<div id="start-section">
  学籍番号（下4桁）: <input type="text" id="student-id" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" />
  <div class="audio-start-row">
      <div id="audio-load-status" aria-live="polite">音声を準備しています…</div>
      <div id="audio-progress-wrap" aria-hidden="true">
        <div id="audio-progress-bar"></div>
      </div>
      <button id="start-btn" onclick="startGame()" style="display:none; margin-top:10px;">スタート</button>
    </div>
</div>
<div id="today-section">
  <div id="today-title">練習しよう</div>
  <div id="today-list"></div>
</div>
<div id="game-info" style="display:none;">
  <p id="turn-info"></p>
  <p id="score-info"></p>
</div>
<div class="image-grid" id="image-grid"></div>
<button id="listen-button" style="display:none;" onclick="playAudioSegment(currentAudioId)">もう一度聞く</button>
<div id="result" style="display:none;"></div>
<!-- Web Audioが利用できない場合の代替再生要素 -->
<audio id="audio-player" preload="metadata"></audio>
<div id="toast" role="status" hidden></div>
<script src="js/config.js"></script>
<script src="js/reponses.js"></script>
<script src="js/scorekey.js"></script>
<script src="js/code.js"></script>
<script src="js/calc.js"></script>
<script src="js/audio.js?v=20261003-audio-prep"></script>
<script src="js/game.js"></script>
</body>
</html>
